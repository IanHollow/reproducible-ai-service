<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIContentGuard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>AIContentGuard</h1>
        <p>Enter text below to analyze its content using multiple AI agents.</p>
        <textarea id="textInput" rows="6" placeholder="Enter text here..."></textarea>
        <button id="analyzeButton">Analyze</button>
        <div id="resultsArea">
            <h2>Results</h2>
            <pre id="jsonOutput">Awaiting analysis...</pre>
        </div>
        <div id="loadingIndicator" style="display: none;">Analyzing...</div>
        <div id="errorArea" style="display: none; color: red;"></div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const analyzeButton = document.getElementById('analyzeButton');
        const jsonOutput = document.getElementById('jsonOutput');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorArea = document.getElementById('errorArea');

        analyzeButton.addEventListener('click', async () => {
            const text = textInput.value;
            if (!text.trim()) {
                errorArea.textContent = 'Please enter some text to analyze.';
                errorArea.style.display = 'block';
                return;
            }

            loadingIndicator.style.display = 'block';
            jsonOutput.textContent = 'Analyzing...';
            errorArea.style.display = 'none';
            analyzeButton.disabled = true;

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || `HTTP error! Status: ${response.status}`);
                }

                // Format and display the JSON result
                jsonOutput.textContent = JSON.stringify(result, null, 2);
                // Optional: Add color coding based on decision
                if (result.decision === 'flagged') {
                    jsonOutput.style.color = 'orange';
                } else {
                    jsonOutput.style.color = 'inherit'; // Reset color
                }

            } catch (error) {
                console.error('Error during analysis:', error);
                jsonOutput.textContent = 'Error during analysis.';
                errorArea.textContent = `Error: ${error.message}`;
                errorArea.style.display = 'block';
            } finally {
                loadingIndicator.style.display = 'none';
                analyzeButton.disabled = false;
            }
        });
    </script>
</body>
</html>
